---
# MultiQC example configuration for MultiQC_neuroimaging

# Bundles module configuration default values.
bundles:
  bundles: [] # List of bundles to include, otherwise will use all detected bundles.
  max_bundles: 20 # Maximum number of bundles to display in the report (default: 10)

# Streamline Count module configuration default thresholds
streamline_count:
  iqr_multiplier: 3 # Default: samples outside Q1 - 3*IQR to Q3 + 3*IQR are marked as fail

# Metricsinroi configuration default thresholds
metricsinroi:
  iqr_multiplier: 3 # Default: samples outside Q1 - 3*IQR to Q3 + 3*IQR are marked as fail

# Framewise Displacement module configuration default thresholds
framewise_displacement:
  warn_threshold: 0.8 # Default: samples with max FD < 0.8mm get "pass" status
  fail_threshold: 2.0 # Default: samples with max FD >= 2.0mm get "fail" status

# Coverage module configuration default thresholds
coverage:
  warn_threshold: 0.9 # Default: samples with dice < 0.9 get "warn" status
  fail_threshold: 0.8 # Default: samples with dice < 0.8 get "fail" status

# Cortical module configuration
# Thresholds for outlier percentage (lower is better)
cortical:
  warn_threshold: 20 # Warn if outlier % > 20%
  fail_threshold: 10 # Pass if outlier % <= 10%
  iqr_multiplier: 3 # Samples outside Q1 - 3*IQR to Q3 + 3*IQR are marked as fail

# Subcortical module configuration
# Thresholds for outlier percentage (lower is better)
subcortical:
  warn_threshold: 20 # Warn if outlier % > 20%
  fail_threshold: 10 # Pass if outlier % <= 10%
  iqr_multiplier: 3 # Samples outside Q1 - 3*IQR to Q3 + 3*IQR are marked as fail

# Tractometry module configuration
tractometry:
  warn_threshold: 90 # Warn if bundle percentage < 90%
  fail_threshold: 80 # Fail if bundle percentage < 80%

# Atlas labels module configuration
atlaslabels:
  atlas_name: "aparc"
  style: "glossy"
  subcortical_rois_indexes: ["189:224"] # Example for brainnetome preadolescent atlas.
  cortical_cmap: "viridis"
  subcortical_cmap: "magma"
  force_cortical_cmap: False # If true, forces the cortical preview to use the cortical_cmap even if a LUT is provided
  force_subcortical_cmap: True # If true, forces the subcortical preview to use the subcortical_cmap even if a LUT is provided
  views: ["left_lateral", "left_medial", "superior", "anterior"]
  figsize: [1200, 450]
  smooth_i: 20
  smooth_f: 0.5

# Structural connectivity module configuration
connectivity:
  # Optional list of metrics to include (case-insensitive).
  # Examples: ["fa", "md", "rd", "ad", "commit"]
  # Set to [] or null to include all detected metrics.
  metrics: []
  iqr_multiplier: 1.5

# Order that modules should appear in the report
module_order:
  - atlaslabels
  - framewise_displacement
  - coverage
  - streamline_count
  - bundles
  - tractometry
  - metricsinroi
  - harmonization
  - cortical
  - subcortical

# File patterns to match for each module (defaults can be overridden here)
sp:
  framewise_displacement:
    fn: "*dwi_eddy_restricted_movement_rms.txt"
  coverage:
    fn: "*coverage_metrics.tsv"
  streamline_count:
    fn: "*streamline_count.tsv"
  bundles/trk:
    fn: "*.trk"
  bundles/nii:
    fn: "*.nii.gz"
  tractometry:
    fn: "*bundles_mean_stats.tsv"
    shared: true
  cortical/volume:
    fn: "cortical_*_volume_*.tsv"
  subcortical/volume:
    fn: "subcortical_*_volume_*.tsv"
  atlaslabels/surfaces:
    fn: "*.white"
  atlaslabels/annot:
    fn: "*.annot"
  atlaslabels/lut:
    fn: "*dseg.tsv"
    shared: true
  atlaslabels/nii:
    fn: "*dseg.nii.gz"
  metricsinroi:
    fn: "*mean_desc-roi_stats.tsv"
    shared: true
  harmonization/reference_stats:
    fn: "*.reference.tsv"
  harmonization/harmonized_stats:
    fn: "*.harmonized.tsv"
  harmonization/raw_stats:
    - fn: "*mean_desc-roi_stats.tsv"
      shared: true
    - fn: "*bundles_mean_stats.tsv"
      shared: true
  harmonization/data_models_plots:
    fn: "DataModels*.json"
  harmonization/harmonization_plots:
    fn: "AgeCurve*.json"
  harmonization/harmonization_distance:
    fn: "*.bhattacharrya.txt"
  connectivity/matrices:
    fn: "*stat-*.npy"
  connectivity/lut:
    fn: "*dseg.tsv"
    shared: true
